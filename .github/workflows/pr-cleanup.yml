name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  # pr-preview-action v1.1.2+ looks up the state of every PR that has a
  # preview directory; without this, lookups 403 and stale previews pile up.
  pull-requests: read

concurrency:
  group: pr-preview-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup PR Preview
        uses: koizuka/pr-preview-action@3c83fb8474344c71cabade2154768b143278e9b1 # v1.1.2
        with:
          action: cleanup
          base-url: https://koizuka.github.io/drawing-practice
          token: ${{ secrets.GITHUB_TOKEN }}
